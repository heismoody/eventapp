name: Build & release app

# development → Cardly Dev (APK)  → uploaded to appdev.cardly.co.tz, picked up by
#                                    the dev app's own updater (latest-dev.json)
# main        → Cardly (Play .aab) → signed bundle attached to the run as an
#                                    artifact, uploaded to Google Play Console
#
# Keep this file's name: GitHub keys the run counter (our build number) to
# the workflow file, and renaming it would restart build numbers at 1 —
# older than what's already installed, so no phone would see an update.
on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    name: ${{ github.ref_name == 'main' && 'Build Play bundle' || 'Build & publish dev APK' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FLAVOR: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true

      - name: Work out version
        run: |
          # Build number = run counter, shared by both branches: always
          # increasing, so every dev push is newer than the last (phones
          # offer the update) and Play never sees a version code twice (it
          # permanently rejects reuse). The +100 keeps it above the numbers
          # used by earlier hand-built releases. The version name (1.0.1, …)
          # still comes from pubspec.yaml.
          echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed -E 's/^version: *([^+]+).*/\1/')
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Without the real key Gradle would quietly fall back to a throwaway
          # debug key — a dev APK that can't update installs, or a bundle Play
          # rejects as not signed with the registered upload key.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets are missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=cardly
          storeFile=$RUNNER_TEMP/release.jks
          EOF

      - name: Analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      # ───────────── main → Google Play bundle ─────────────

      - name: Build Play bundle
        if: env.FLAVOR == 'prod'
        run: |
          flutter build appbundle --release --flavor prod --build-number="$BUILD_NUMBER"
          mkdir -p release
          cp build/app/outputs/bundle/prodRelease/app-prod-release.aab \
            "release/cardly-$VERSION_NAME-$BUILD_NUMBER.aab"

      - name: Attach bundle to this run
        if: env.FLAVOR == 'prod'
        uses: actions/upload-artifact@v4
        with:
          name: cardly-${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}-play
          path: release/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload instructions
        if: env.FLAVOR == 'prod'
        run: |
          {
            echo "## Cardly $VERSION_NAME (version code $BUILD_NUMBER) — ready for Google Play"
            echo ""
            echo "1. Download the **cardly-$VERSION_NAME-$BUILD_NUMBER-play** artifact below (a zip with the .aab)."
            echo "2. Play Console → Cardly → Testing (or Production) → Create new release → upload the .aab."
          } >> "$GITHUB_STEP_SUMMARY"

      # ───────────── development → self-hosted dev APK ─────────────

      - name: Build dev APK
        if: env.FLAVOR == 'dev'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          flutter build apk --release --flavor dev --build-number="$BUILD_NUMBER"

          # Build number in the name: every release is a new URL, so a CDN
          # can never serve a cached older APK under the latest manifest.
          APK_NAME="cardly-dev-$VERSION_NAME-$BUILD_NUMBER.apk"
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-dev-release.apk "release/$APK_NAME"

          NOTES=$(printf '%s' "${COMMIT_MESSAGE:-Manual release}" | head -n 1)
          jq -n \
            --argjson code "$BUILD_NUMBER" \
            --arg name "$VERSION_NAME" \
            --arg url "https://appdev.cardly.co.tz/app-releases/$APK_NAME" \
            --arg notes "$NOTES" \
            '{versionCode: $code, versionName: $name, apkUrl: $url, releaseNotes: $notes, mandatory: false}' \
            > release/latest-dev.json

          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          cat release/latest-dev.json

      # APK first, manifest second — a phone must never read a manifest that
      # points at a file that isn't on the server yet.
      - name: Upload dev APK
        if: env.FLAVOR == 'dev'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: release/${{ env.APK_NAME }}
          target: ${{ secrets.DEPLOY_PATH_DEV }}/public/app-releases
          strip_components: 1

      - name: Publish dev manifest
        if: env.FLAVOR == 'dev'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: release/latest-dev.json
          target: ${{ secrets.DEPLOY_PATH_DEV }}/public/app-releases
          strip_components: 1

      - name: Remove old dev APKs (keep the latest 3)
        if: env.FLAVOR == 'dev'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH_DEV }}/public/app-releases"
            ls -1t cardly-dev-*.apk 2>/dev/null | tail -n +4 | xargs -r rm -f --
            ls -la
